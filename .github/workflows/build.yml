name: build

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  # The DSP core and the test suite are platform independent, so they run on a
  # Linux runner for fast feedback.
  core:
    name: core (Linux, gcc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DAPOLITE_BUILD_APO=OFF -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  # The APO shell and the editor are Windows-only, built with MSVC.
  windows:
    name: windows (msvc)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # No -G: the runner image may ship a newer Visual Studio than the one we
      # would otherwise name explicitly, and a stale generator name fails.
      - name: Configure
        run: cmake -B build -A x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure

      # The editor and setup tool are self-contained executables, so they ship
      # next to the DLL.
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: ApoLite-windows
          path: |
            build/**/ApoLite.dll
            build/**/ApoLiteEditor.exe
            build/**/ApoLiteSetup.exe
          if-no-files-found: warn
